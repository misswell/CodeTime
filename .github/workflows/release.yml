name: Release CodeTime

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        required: true
        default: beta
        options: [beta, rc, stable]

permissions:
  contents: write

concurrency:
  group: codetime-release-${{ github.ref }}
  cancel-in-progress: false

env:
  KOPIA_VERSION: "0.23.1"
  KOPIA_PATH: ${{ github.workspace }}/Resources/Kopia/kopia

jobs:
  classify:
    runs-on: macos-15
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - name: Classify tag
        id: channel
        env:
          TAG: ${{ github.ref_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          CHANNEL=""
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            CHANNEL="beta"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            CHANNEL="rc"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
          elif [ -n "${INPUT_CHANNEL:-}" ]; then
            CHANNEL="$INPUT_CHANNEL"
          fi
          if [ -z "$CHANNEL" ]; then
            echo "无法识别的发布 tag：$TAG" >&2
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "release channel: $CHANNEL"

  regression:
    needs: classify
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: Resources/Kopia
          key: kopia-${{ runner.os }}-${{ env.KOPIA_VERSION }}
      - name: Fetch and verify Kopia
        run: ./Scripts/fetch_kopia.sh
      - name: Full regression gate
        run: ./Scripts/regression_gate.sh
      - name: Validate entitlements
        run: ./Scripts/validate_entitlements.sh

  beta:
    needs: [classify, regression]
    if: needs.classify.outputs.channel == 'beta' || needs.classify.outputs.channel == 'rc'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: Resources/Kopia
          key: kopia-${{ runner.os }}-${{ env.KOPIA_VERSION }}
      - run: ./Scripts/fetch_kopia.sh
      - run: brew install xcodegen
      - name: Package pre-release
        env:
          TAG: ${{ github.ref_name }}
        run: ./Scripts/package_beta.sh
      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES="Docs/releases/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "missing release notes: $NOTES" >&2
            exit 1
          fi
          gh release create "$TAG" \
            dist/*.zip dist/*.zip.sha256 \
            --title "CodeTime ${TAG}" \
            --notes-file "$NOTES" \
            --prerelease \
            --verify-tag

  stable:
    needs: [classify, regression]
    if: needs.classify.outputs.channel == 'stable'
    runs-on: macos-15
    timeout-minutes: 60
    environment: stable-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: Resources/Kopia
          key: kopia-${{ runner.os }}-${{ env.KOPIA_VERSION }}
      - run: ./Scripts/fetch_kopia.sh
      - run: brew install xcodegen
      - name: Require signing and notarization secrets
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DEVELOPMENT_TEAM:?stable release requires DEVELOPMENT_TEAM secret}"
          : "${APPLE_ID:?stable release requires APPLE_ID secret}"
          : "${NOTARY_PASSWORD:?stable release requires NOTARY_PASSWORD secret}"
      - name: Package, notarize and staple
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TAG: ${{ github.ref_name }}
          CODETIME_RELEASE_CHANNEL: stable
        run: ./Scripts/package_release.sh
      - name: Verify signed artifact
        run: ./Scripts/verify_release.sh dist/CodeTime-*-macos-universal.zip
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NOTES="Docs/releases/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "missing release notes: $NOTES" >&2
            exit 1
          fi
          gh release create "$TAG" \
            dist/*.zip dist/*.zip.sha256 \
            --title "CodeTime ${TAG}" \
            --notes-file "$NOTES" \
            --latest \
            --verify-tag

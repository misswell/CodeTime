name: Release CodeTime

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        required: true
        default: beta
        options: [beta, rc, stable]
      version:
        description: "Marketing version, e.g. 1.0.0"
        type: string
        required: true
      release_tag:
        description: "Existing git tag to publish (e.g. v1.0.0-beta.1). Must point at this commit."
        type: string
        required: true
      prerelease:
        description: "Beta/RC number, e.g. 1"
        type: string
        required: false
        default: "1"
      publish_release:
        description: "Create a GitHub Release for manual dispatch"
        type: boolean
        required: false
        default: true
      icloud_beta:
        description: "Beta with real iCloud entitlements (needs APPLE_PROVISIONING_PROFILE; for two-Mac acceptance)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: codetime-release-${{ github.ref }}
  cancel-in-progress: false

env:
  KOPIA_VERSION: "0.23.1"
  KOPIA_PATH: ${{ github.workspace }}/Resources/Kopia/kopia

jobs:
  classify:
    runs-on: macos-15
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      tag: ${{ steps.channel.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify tag
        id: channel
        env:
          TAG: ${{ github.ref_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          CHANNEL=""
          RESOLVED_TAG="$TAG"
          if [ -n "${INPUT_VERSION:-}" ]; then
            # Manual dispatch from a branch. CT-079: the dispatch MUST name an
            # EXISTING tag and that tag must point at this build's commit — a
            # manual run never fabricates a tag for the wrong commit.
            CHANNEL="$INPUT_CHANNEL"
            RESOLVED_TAG="${INPUT_RELEASE_TAG:-}"
            if [ -z "$RESOLVED_TAG" ]; then
              echo "手动发布必须填写 release_tag（要发布的既有 git tag）" >&2
              exit 1
            fi
            case "$CHANNEL" in
              beta) [[ "$RESOLVED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || { echo "beta 渠道 tag 格式必须为 vX.Y.Z-beta.N：$RESOLVED_TAG" >&2; exit 1; } ;;
              rc) [[ "$RESOLVED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || { echo "rc 渠道 tag 格式必须为 vX.Y.Z-rc.N：$RESOLVED_TAG" >&2; exit 1; } ;;
              stable) [[ "$RESOLVED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "stable 渠道 tag 格式必须为 vX.Y.Z：$RESOLVED_TAG" >&2; exit 1; } ;;
              *) echo "无法识别的手动发布渠道：$CHANNEL" >&2; exit 1 ;;
            esac
            git fetch --force origin "refs/tags/$RESOLVED_TAG:refs/tags/$RESOLVED_TAG" 2>/dev/null \
              || { echo "release_tag 不存在：$RESOLVED_TAG — 请先创建并推送该 tag" >&2; exit 1; }
            # CT-079: shared validator (unit-tested by testCT079_*).
            "$GITHUB_WORKSPACE/Scripts/validate_release_tag.sh" "$RESOLVED_TAG" "$GITHUB_SHA"
            if [ -n "${INPUT_VERSION:-}" ] && [[ "$RESOLVED_TAG" != "v${INPUT_VERSION}"* ]]; then
              echo "release_tag $RESOLVED_TAG 与 version ${INPUT_VERSION} 不一致" >&2
              exit 1
            fi
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            CHANNEL="beta"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            CHANNEL="rc"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
          else
            echo "无法识别的发布 tag：$TAG" >&2
            exit 1
          fi
          if [ -z "$CHANNEL" ]; then
            echo "无法识别的发布 tag：$TAG" >&2
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
          echo "release channel: $CHANNEL ($RESOLVED_TAG)"

  regression:
    needs: classify
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: Resources/Kopia
          key: kopia-${{ runner.os }}-${{ env.KOPIA_VERSION }}
      - name: Fetch and verify Kopia
        run: ./Scripts/fetch_kopia.sh
      - name: Full regression gate
        env:
          CODETIME_SCALE_TESTS: "1"
        run: ./Scripts/regression_gate.sh
      - name: Validate entitlements
        run: ./Scripts/validate_entitlements.sh

  beta:
    needs: [classify, regression]
    if: needs.classify.outputs.channel == 'beta' || needs.classify.outputs.channel == 'rc'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: Resources/Kopia
          key: kopia-${{ runner.os }}-${{ env.KOPIA_VERSION }}
      - run: ./Scripts/fetch_kopia.sh
      - run: brew install xcodegen
      - name: Import Developer ID certificate (if configured)
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12_BASE64:-}" ]; then
            echo "no signing certificate configured; beta falls back to ad-hoc"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/codetime-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo -n "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | head -5
      - name: Install provisioning profile (iCloud beta only)
        if: ${{ inputs.icloud_beta }}
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "${PROFILE_BASE64:-}" ]; then
            echo "icloud_beta 需要 APPLE_PROVISIONING_PROFILE secret" >&2
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/codetime.provisionprofile"
          DECODED="$(security cms -D -i "$RUNNER_TEMP/codetime.provisionprofile")"
          NAME="$(printf '%s' "$DECODED" | plutil -extract Name raw -)"
          UUID="$(printf '%s' "$DECODED" | plutil -extract UUID raw -)"
          cp "$RUNNER_TEMP/codetime.provisionprofile" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROVISIONING_PROFILE_SPECIFIER=$NAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/codetime.provisionprofile"
      - name: Package pre-release
        env:
          TAG: ${{ needs.classify.outputs.tag }}
          CODETIME_PKG_TRACE: "1"
          CODETIME_BETA_ICLOUD: ${{ inputs.icloud_beta && '1' || '0' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.NOTARY_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID || secrets.DEVELOPMENT_TEAM }}
        run: ./Scripts/package_beta.sh
      - name: Upload pre-release artifact
        uses: actions/upload-artifact@v4
        with:
          name: codetime-${{ needs.classify.outputs.tag }}
          path: dist/*
          if-no-files-found: error
      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.classify.outputs.tag }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          NOTES="Docs/releases/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "missing release notes: $NOTES" >&2
            exit 1
          fi
          VERIFY=""
          if [[ "$REF" == refs/tags/* ]]; then VERIFY="--verify-tag"; fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            dist/*.zip dist/*.zip.sha256 dist/*.dmg \
            --title "CodeTime ${TAG}" \
            --notes-file "$NOTES" \
            --prerelease $VERIFY

  # Phase 1: Candidate build (Developer ID signed, notarized, stapled)
  candidate:
    needs: [classify, regression]
    if: needs.classify.outputs.channel == 'stable'
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: Resources/Kopia
          key: kopia-${{ runner.os }}-${{ env.KOPIA_VERSION }}
      - run: ./Scripts/fetch_kopia.sh
      - run: brew install xcodegen
      - name: Require signing and notarization secrets
        env:
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID || secrets.DEVELOPMENT_TEAM }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${CERT_P12:?stable release requires APPLE_CERTIFICATE_P12 secret}"
          : "${CERT_PASSWORD:?stable release requires APPLE_CERTIFICATE_PASSWORD secret}"
          : "${DEVELOPMENT_TEAM:?stable release requires APPLE_TEAM_ID secret}"
          : "${APPLE_ID:?stable release requires APPLE_ID secret}"
          : "${NOTARY_PASSWORD:?stable release requires APPLE_APP_SPECIFIC_PASSWORD secret}"
      - name: Import Developer ID certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          EXPECTED_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          set -euo pipefail
          # A fresh runner has NO signing identity: without this import
          # package_release.sh can never find Developer ID and the release fails.
          KEYCHAIN="$RUNNER_TEMP/codetime-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo -n "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | head -5
          rm -f "$RUNNER_TEMP/cert.p12"
          if [ -n "${EXPECTED_IDENTITY:-}" ]; then
            security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$EXPECTED_IDENTITY" \
              || { echo "导入的证书与 APPLE_DEVELOPER_ID 不一致" >&2; exit 1; }
          fi
      - name: Install Developer ID provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          # iCloud entitlements + Developer ID require a profile; without it the
          # archive step cannot succeed, so fail here with an actionable message.
          if [ -z "${PROFILE_BASE64:-}" ]; then
            echo "缺少 APPLE_PROVISIONING_PROFILE secret：Developer ID + iCloud 必须有描述文件。" >&2
            echo "在 developer.apple.com 创建 Developer ID 描述文件（含 iCloud 容器与 App Group），" >&2
            echo "下载后 base64 编码写入该 secret。" >&2
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/codetime.provisionprofile"
          DECODED="$(security cms -D -i "$RUNNER_TEMP/codetime.provisionprofile")"
          NAME="$(printf '%s' "$DECODED" | plutil -extract Name raw -)"
          UUID="$(printf '%s' "$DECODED" | plutil -extract UUID raw -)"
          cp "$RUNNER_TEMP/codetime.provisionprofile" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROVISIONING_PROFILE_SPECIFIER=$NAME" >> "$GITHUB_ENV"
          echo "installed provisioning profile: $NAME ($UUID)"
          rm -f "$RUNNER_TEMP/codetime.provisionprofile"
      - name: Package, notarize and staple
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID || secrets.DEVELOPMENT_TEAM }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.NOTARY_PASSWORD }}
          TAG: ${{ needs.classify.outputs.tag }}
          CODETIME_RELEASE_CHANNEL: stable
        run: ./Scripts/package_release.sh
      - name: Verify signed artifact
        run: ./Scripts/verify_release.sh dist/CodeTime-*-macos-universal.zip
      - name: Record artifact metadata
        id: artifact
        run: |
          ZIP="$(ls dist/CodeTime-*-macos-universal.zip)"
          SHA256="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          NAME="$(basename "$ZIP")"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "candidate artifact: $NAME"
          echo "candidate sha256: $SHA256"
      - name: Upload immutable candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: codetime-candidate-${{ needs.classify.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  # Phase 2: Acceptance — verify the candidate artifact is the one that was
  # accepted on real devices. Downloads the EXACT candidate (not a rebuild).
  acceptance:
    needs: [classify, candidate]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download immutable candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: codetime-candidate-${{ needs.classify.outputs.tag }}
          path: candidate/
      - name: Fetch acceptance report from release-acceptance branch
        env:
          TAG: ${{ needs.classify.outputs.tag }}
        run: |
          set -euo pipefail
          # CT-083: the report lives on the protected `release-acceptance`
          # branch — NEVER in the release tag's source commit (committing it
          # there would change the build commit and recreate the circular
          # dependency where the candidate must contain its own acceptance).
          git fetch --force origin release-acceptance:refs/remotes/origin/release-acceptance \
            || { echo "缺少 release-acceptance 分支（验收报告存储位置）" >&2; exit 1; }
          REPORT="Docs/releases/${TAG}-icloud-acceptance.md"
          git show "origin/release-acceptance:$REPORT" > acceptance-report.md \
            || { echo "release-acceptance 分支缺少 $REPORT" >&2; exit 1; }
          echo "ICLOUD_ACCEPTANCE_REPORT=$PWD/acceptance-report.md" >> "$GITHUB_ENV"
      - name: Verify candidate SHA-256 and require two-Mac iCloud acceptance report
        env:
          TAG: ${{ needs.classify.outputs.tag }}
        run: |
          set -euo pipefail
          # CT-077: the SHA-256 of the EXACT downloaded artifact is compared
          # against the report — missing or mismatched SHA blocks the release.
          ZIP="$(ls candidate/CodeTime-*-macos-universal.zip)"
          export EXPECTED_ARTIFACT_SHA="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          echo "candidate artifact: $(basename "$ZIP") sha256=$EXPECTED_ARTIFACT_SHA"
          ./Scripts/require_icloud_acceptance.sh "$TAG"
      - name: Verify tag matches build commit
        run: |
          set -euo pipefail
          TAG_SHA="$(git rev-parse "refs/tags/${{ needs.classify.outputs.tag }}^{commit}")"
          BUILD_SHA="${{ github.sha }}"
          if [ "$TAG_SHA" != "$BUILD_SHA" ]; then
            echo "::error::Tag commit $TAG_SHA != build commit $BUILD_SHA" >&2
            exit 1
          fi
          echo "tag/commit verified: $TAG_SHA"
      - name: Verify signing and notarization
        run: |
          set -euo pipefail
          ZIP="$(ls candidate/CodeTime-*-macos-universal.zip)"
          "$GITHUB_WORKSPACE/Scripts/verify_release.sh" "$ZIP"
      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: codetime-verified-${{ needs.classify.outputs.tag }}
          path: candidate/*
          if-no-files-found: error

  # Phase 3: Publish the verified candidate artifact (no rebuild).
  publish-stable:
    needs: [classify, acceptance]
    runs-on: macos-15
    timeout-minutes: 15
    environment: stable-release
    steps:
      # CT-100: the release notes (Docs/releases/<tag>.md) live in the repo —
      # without a checkout the publish step can never find them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download verified candidate
        uses: actions/download-artifact@v4
        with:
          name: codetime-verified-${{ needs.classify.outputs.tag }}
          path: dist/
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.classify.outputs.tag }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          NOTES="Docs/releases/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "missing release notes: $NOTES" >&2
            exit 1
          fi
          VERIFY=""
          if [[ "$REF" == refs/tags/* ]]; then VERIFY="--verify-tag"; fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            dist/*.zip dist/*.zip.sha256 dist/*.dmg \
            --title "CodeTime ${TAG}" \
            --notes-file "$NOTES" \
            --latest $VERIFY

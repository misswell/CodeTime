name: Release CodeTime

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        required: true
        default: beta
        options: [beta, rc, stable]
      version:
        description: "Marketing version, e.g. 1.0.0"
        type: string
        required: true
      prerelease:
        description: "Beta/RC number, e.g. 1"
        type: string
        required: false
        default: "1"
      publish_release:
        description: "Create a GitHub Release for manual dispatch"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: codetime-release-${{ github.ref }}
  cancel-in-progress: false

env:
  KOPIA_VERSION: "0.23.1"
  KOPIA_PATH: ${{ github.workspace }}/Resources/Kopia/kopia

jobs:
  classify:
    runs-on: macos-15
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      tag: ${{ steps.channel.outputs.tag }}
    steps:
      - name: Classify tag
        id: channel
        env:
          TAG: ${{ github.ref_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          CHANNEL=""
          RESOLVED_TAG="$TAG"
          if [ -n "${INPUT_VERSION:-}" ]; then
            # Manual dispatch from a branch: build the tag from the requested
            # version instead of using the branch name.
            CHANNEL="$INPUT_CHANNEL"
            case "$CHANNEL" in
              beta) RESOLVED_TAG="v${INPUT_VERSION}-beta.${INPUT_PRERELEASE:-1}" ;;
              rc) RESOLVED_TAG="v${INPUT_VERSION}-rc.${INPUT_PRERELEASE:-1}" ;;
              stable) RESOLVED_TAG="v${INPUT_VERSION}" ;;
              *) echo "无法识别的手动发布渠道：$CHANNEL" >&2; exit 1 ;;
            esac
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            CHANNEL="beta"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            CHANNEL="rc"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="stable"
          else
            echo "无法识别的发布 tag：$TAG" >&2
            exit 1
          fi
          if [ -z "$CHANNEL" ]; then
            echo "无法识别的发布 tag：$TAG" >&2
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
          echo "release channel: $CHANNEL ($RESOLVED_TAG)"

  regression:
    needs: classify
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: Resources/Kopia
          key: kopia-${{ runner.os }}-${{ env.KOPIA_VERSION }}
      - name: Fetch and verify Kopia
        run: ./Scripts/fetch_kopia.sh
      - name: Full regression gate
        run: ./Scripts/regression_gate.sh
      - name: Validate entitlements
        run: ./Scripts/validate_entitlements.sh

  beta:
    needs: [classify, regression]
    if: needs.classify.outputs.channel == 'beta' || needs.classify.outputs.channel == 'rc'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: Resources/Kopia
          key: kopia-${{ runner.os }}-${{ env.KOPIA_VERSION }}
      - run: ./Scripts/fetch_kopia.sh
      - run: brew install xcodegen
      - name: Package pre-release
        env:
          TAG: ${{ needs.classify.outputs.tag }}
        run: ./Scripts/package_beta.sh
      - name: Upload pre-release artifact
        uses: actions/upload-artifact@v4
        with:
          name: codetime-${{ needs.classify.outputs.tag }}
          path: dist/*
          if-no-files-found: error
      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.classify.outputs.tag }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          NOTES="Docs/releases/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "missing release notes: $NOTES" >&2
            exit 1
          fi
          VERIFY=""
          if [[ "$REF" == refs/tags/* ]]; then VERIFY="--verify-tag"; fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            dist/*.zip dist/*.zip.sha256 dist/*.dmg \
            --title "CodeTime ${TAG}" \
            --notes-file "$NOTES" \
            --prerelease $VERIFY

  stable:
    needs: [classify, regression]
    if: needs.classify.outputs.channel == 'stable'
    runs-on: macos-15
    timeout-minutes: 60
    environment: stable-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: Resources/Kopia
          key: kopia-${{ runner.os }}-${{ env.KOPIA_VERSION }}
      - run: ./Scripts/fetch_kopia.sh
      - run: brew install xcodegen
      - name: Require signing and notarization secrets
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DEVELOPMENT_TEAM:?stable release requires DEVELOPMENT_TEAM secret}"
          : "${APPLE_ID:?stable release requires APPLE_ID secret}"
          : "${NOTARY_PASSWORD:?stable release requires NOTARY_PASSWORD secret}"
      - name: Require two-Mac iCloud acceptance report
        run: ./Scripts/require_icloud_acceptance.sh "${{ needs.classify.outputs.tag }}"
      - name: Package, notarize and staple
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TAG: ${{ needs.classify.outputs.tag }}
          CODETIME_RELEASE_CHANNEL: stable
        run: ./Scripts/package_release.sh
      - name: Verify signed artifact
        run: ./Scripts/verify_release.sh dist/CodeTime-*-macos-universal.zip
      - name: Upload stable artifact
        uses: actions/upload-artifact@v4
        with:
          name: codetime-${{ needs.classify.outputs.tag }}
          path: dist/*
          if-no-files-found: error
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.classify.outputs.tag }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          NOTES="Docs/releases/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "missing release notes: $NOTES" >&2
            exit 1
          fi
          VERIFY=""
          if [[ "$REF" == refs/tags/* ]]; then VERIFY="--verify-tag"; fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            dist/*.zip dist/*.zip.sha256 dist/*.dmg \
            --title "CodeTime ${TAG}" \
            --notes-file "$NOTES" \
            --latest $VERIFY
